<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDN Track 1 — Intelligent Load Balancer Explainer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="viewport">
    <div id="stage" aria-label="SDN Track 1 Motion Graphics Stage">
      <canvas id="bg-canvas" width="1920" height="1080"></canvas>
      <div id="scenes-layer"></div>
      <div id="chrome-layer" aria-hidden="true">
        <div id="hud-top">
          <div id="hud-chapter" class="hud-pill">
            <span class="hud-dot"></span>
            <span id="hud-chapter-text">01 / OVERVIEW</span>
          </div>
          <div id="hud-tag" class="hud-tag">SDN TRACK 1 · OPENFLOW 1.3</div>
        </div>
        <div id="hud-bottom">
          <div id="hud-rail">
            <div id="hud-progress-fill"></div>
            <div id="hud-ticks"></div>
          </div>
          <div id="hud-time" class="tabular">00:00.0 / 01:36.0</div>
        </div>
      </div>
    </div>
  </div>

  <div id="controls" role="region" aria-label="Playback Controls">
    <button id="btn-play" type="button" title="Play / Pause (Space)">Play</button>
    <button id="btn-prev" type="button" title="Previous Frame (Left Arrow)">-1f</button>
    <button id="btn-next" type="button" title="Next Frame (Right Arrow)">+1f</button>
    <input id="scrubber" type="range" min="0" max="96" step="0.033333" value="0" aria-label="Timeline Scrubber" />
    <span id="ctrl-time" class="tabular">00:00.0 / 01:36.0</span>
    <div id="chapter-buttons"></div>
  </div>

  <script src="./engine.js"></script>
  <script src="./grid-svg.js"></script>
  <script src="./scenes/scene1-hook.js"></script>
  <script src="./scenes/scene2-problem.js"></script>
  <script src="./scenes/scene3-telemetry.js"></script>
  <script src="./scenes/scene4-paths.js"></script>
  <script src="./scenes/scene5-mbb.js"></script>
  <script src="./scenes/scene6-failover.js"></script>
  <script src="./scenes/scene7-benchmarks.js"></script>
  <script src="./scenes/scene8-outro.js"></script>
  <script>
    if (window.SDN_VIDEO && typeof window.SDN_VIDEO.init === "function") {
      window.SDN_VIDEO.init();
    }
  </script>
</body>
</html>
